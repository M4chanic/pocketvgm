[target.riscv32imac-unknown-none-elf]
rustflags = [
  "-C", "link-arg=-Tregions.ld",
  "-C", "link-arg=-Tmemory.x",
  "-C", "link-arg=-Tlink.x",
]

# Требуется nightly (build-std для no_std-таргета)
[unstable]
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "compiler_builtins", "alloc"]

[build]
# Программная плавучка: FPU выкинут из ядра ради ~2.5К ALM.
# Вещественная арифметика в плеере — только расчёт делителей частоты
# при старте трека, в звуковом тракте её нет.
target = "riscv32imac-unknown-none-elf"

[env]
# Ensure CC builds properly for platform
CC_riscv32imac_unknown_none_elf = "riscv64-unknown-elf-gcc"
CFLAGS_riscv32imac_unknown_none_elf = "-mabi=ilp32 -march=rv32imac"
